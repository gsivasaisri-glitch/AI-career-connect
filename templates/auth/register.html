<!--
templates/auth/register.html — Registration Page
==================================================
WHY THIS FILE EXISTS:
    Handles new user sign-up. Collects username, email, and password.
    Includes client-side validation (password match) and server-side
    validation (duplicate username/email checks in app.py).
-->
{% extends "base.html" %}
{% block title %}Register — AI Career Connect{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 pt-5">
        <div class="col-md-5">
            <div class="glass-card p-5 auth-card">
                <div class="text-center mb-4">
                    <div class="auth-icon mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-muted">Start your AI-powered career journey</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}" id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person me-1"></i> Username
                        </label>
                        <input type="text" class="form-control form-control-lg" id="username"
                               name="username" required minlength="3" maxlength="80"
                               placeholder="Choose a username">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope me-1"></i> Email
                        </label>
                        <input type="email" class="form-control form-control-lg" id="email"
                               name="email" required
                               placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock me-1"></i> Password
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password"
                               name="password" required minlength="6"
                               placeholder="Minimum 6 characters">
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">
                            <i class="bi bi-lock-fill me-1"></i> Confirm Password
                        </label>
                        <input type="password" class="form-control form-control-lg" id="confirm_password"
                               name="confirm_password" required minlength="6"
                               placeholder="Re-enter your password">
                        <div class="invalid-feedback" id="passwordMismatch">
                            Passwords do not match.
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="registerBtn">
                        <i class="bi bi-rocket-takeoff me-2"></i>Create Account
                    </button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-semibold">
                            Sign in
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Client-side password match validation
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;
        if (password !== confirm) {
            e.preventDefault();
            document.getElementById('confirm_password').classList.add('is-invalid');
            document.getElementById('passwordMismatch').style.display = 'block';
        }
    });
</script>
{% endblock %}
